[workspace]
members = [
    "ananke",
    "anankectl",
    "crates/allocator",
    "crates/api",
    "crates/config",
    "crates/db",
    "crates/devices",
    "crates/errors",
    "crates/estimate",
    "crates/events",
    "crates/fs",
    "crates/gguf",
    "crates/observation",
    "crates/placement",
    "crates/proxy",
    "crates/spawn",
    "crates/supervise",
    "crates/system",
    "crates/templates",
    "crates/tracking",
    "crates/time",
    "crates/tuning",
    "crates/tuning-schema",
    "calibration/crates/calibrate",
    "calibration/crates/dataset",
    "calibration/crates/measure",
    "xtask",
]
# `xtask` is excluded so a bare `cargo build` does not build it. Pass `--workspace`
# to every check regardless: omitting it drops xtask from linting too, which is how
# it once accumulated eight unnoticed warnings.
default-members = [
    "ananke",
    "anankectl",
    "crates/allocator",
    "crates/api",
    "crates/config",
    "crates/db",
    "crates/devices",
    "crates/errors",
    "crates/estimate",
    "crates/events",
    "crates/fs",
    "crates/gguf",
    "crates/observation",
    "crates/placement",
    "crates/proxy",
    "crates/spawn",
    "crates/supervise",
    "crates/system",
    "crates/templates",
    "crates/tracking",
    "crates/time",
    "crates/tuning",
    "crates/tuning-schema",
    "calibration/crates/calibrate",
    "calibration/crates/dataset",
    "calibration/crates/measure",
]
resolver = "2"

[workspace.package]
edition = "2024"
version = "0.2.0"

[workspace.dependencies]
# Internal crates
ananke-allocator = { path = "crates/allocator" }
ananke-api = { path = "crates/api" }
ananke-config = { path = "crates/config" }
ananke-db = { path = "crates/db" }
ananke-devices = { path = "crates/devices" }
ananke-errors = { path = "crates/errors" }
ananke-estimate = { path = "crates/estimate" }
ananke-events = { path = "crates/events" }
ananke-fs = { path = "crates/fs" }
ananke-gguf = { path = "crates/gguf" }
ananke-observation = { path = "crates/observation" }
ananke-placement = { path = "crates/placement" }
ananke-proxy = { path = "crates/proxy" }
ananke-spawn = { path = "crates/spawn" }
ananke-supervise = { path = "crates/supervise" }
ananke-system = { path = "crates/system" }
ananke-templates = { path = "crates/templates" }
ananke-tracking = { path = "crates/tracking" }
ananke-time = { path = "crates/time" }
ananke-tuning = { path = "crates/tuning" }
ananke-tuning-schema = { path = "crates/tuning-schema" }
ananke-calibrate = { path = "calibration/crates/calibrate" }
ananke-dataset = { path = "calibration/crates/dataset" }
ananke-measure = { path = "calibration/crates/measure" }

# Async + HTTP
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "signal", "process", "time", "fs", "sync"] }
hyper = { version = "1", features = ["server", "client", "http1"] }
hyper-util = { version = "0.1", features = ["tokio", "server", "server-auto", "client", "client-legacy", "http1"] }
http = "1"
http-body-util = "0.1"
bytes = "1"
axum = { version = "0.7", features = ["macros", "json", "ws"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["trace", "cors"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "json"] }

# Serde + formats
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
toml_edit = { version = "0.22", features = ["serde"] }

# OpenAPI
utoipa = { version = "5", features = ["axum_extras", "smallvec", "uuid"] }
utoipa-axum = "0.2"

# Other shared
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
smol_str = { version = "0.3", features = ["serde"] }
jiff = "0.2"
parking_lot = "0.12"
arc-swap = "1"
sha2 = "0.10"
base64 = "0.22"
uuid = { version = "1", features = ["v4"] }
clap = { version = "4", features = ["derive", "env"] }
async-trait = "0.1"
pin-project-lite = "0.2"
futures = "0.3"
regex = "1"
libc = "0.2"
notify = "6"

# URL handling
url = "2"

# Linux-only
nvml-wrapper = "0.10"
nix = { version = "0.29", features = ["signal", "fs", "process"] }

# Database
rusqlite = { version = "0.39", features = ["bundled"] }

# Frontend bundling
rust-embed = { version = "8", features = ["interpolate-folder-path"] }
mime_guess = "2"

# Dev
pretty_assertions = "1"
proptest = "1"
tempfile = "3"
tokio-stream = "0.1"
flate2 = "1"
