[package]
name = "ananke"
version.workspace = true
edition.workspace = true

[[bin]]
name = "ananke"
path = "src/main.rs"

[lib]
name = "ananke"
path = "src/lib.rs"

[dependencies]
ananke-api.workspace = true
ananke-allocator.workspace = true
ananke-config = { workspace = true, features = ["test-fakes"] }
ananke-db.workspace = true
ananke-devices.workspace = true
ananke-errors.workspace = true
ananke-estimate.workspace = true
ananke-events.workspace = true
ananke-fs.workspace = true
ananke-gguf.workspace = true
ananke-observation.workspace = true
ananke-placement.workspace = true
ananke-proxy.workspace = true
ananke-spawn.workspace = true
ananke-system = { workspace = true, features = ["test-fakes"] }
ananke-supervise.workspace = true
ananke-templates.workspace = true
ananke-time.workspace = true
ananke-tracking.workspace = true

tokio.workspace = true
hyper.workspace = true
hyper-util.workspace = true
http.workspace = true
http-body-util.workspace = true
bytes.workspace = true
axum.workspace = true
tower.workspace = true
tower-http.workspace = true
reqwest.workspace = true

serde.workspace = true
serde_json.workspace = true
toml.workspace = true
toml_edit.workspace = true

utoipa.workspace = true
utoipa-axum.workspace = true

tracing.workspace = true
tracing-subscriber.workspace = true
smol_str.workspace = true
parking_lot.workspace = true
arc-swap.workspace = true
base64.workspace = true
notify.workspace = true
sha2.workspace = true
ulid.workspace = true
async-trait.workspace = true
pin-project-lite.workspace = true
futures.workspace = true
regex.workspace = true
libc.workspace = true

nvml-wrapper.workspace = true
nix.workspace = true

rusqlite.workspace = true

rust-embed = { workspace = true, optional = true, features = ["debug-embed"] }
mime_guess = { workspace = true, optional = true }

[build-dependencies]
serde_json.workspace = true

[dev-dependencies]
# The calibration dataset's schema, for the integration test that replays the
# campaign's measurements against the estimator. A test dependency only: nothing
# in the daemon reads the dataset.
ananke-dataset.workspace = true
proptest.workspace = true
pretty_assertions.workspace = true
tokio = { workspace = true, features = ["full", "test-util"] }
tokio-stream.workspace = true
futures.workspace = true
tokio-tungstenite = { version = "0.26", default-features = false, features = ["connect"] }

[features]
default = ["frontend"]
frontend = ["dep:rust-embed", "dep:mime_guess"]
# Integration tests (separate crates) use fakes from several split crates;
# `cfg(test)` can't gate them, so the daemon's test-fakes forwards to the
# crates whose fakes those tests reach for. ananke-system + ananke-config
# are also unconditional deps because the daemon lib's own cfg(test) unit
# tests need their fakes (a dependency's cfg(test) does not propagate).
test-fakes = [
    "ananke-config/test-fakes",
    "ananke-system/test-fakes",
    "ananke-supervise/test-fakes",
]
