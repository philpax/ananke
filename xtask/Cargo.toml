[package]
name = "xtask"
version.workspace = true
edition.workspace = true
publish = false

[[bin]]
name = "xtask"
path = "src/main.rs"

[dependencies]
ananke-config = { path = "../crates/config" }
clap.workspace = true
toml_edit.workspace = true
serde.workspace = true
serde_json.workspace = true
cargo_metadata = "0.18"
# Font subsetting for `subset-fonts`. The HarfBuzz wrapper compiles HarfBuzz
# from C++ in its build script, which is one reason these stay xtask-only.
mkwebfont_hb-subset = "0.5"
sha2.workspace = true
ttf2woff2 = { version = "0.14", default-features = false }
zip = { version = "9", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[dev-dependencies]
insta = "1"
